<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>找不到頁面｜致遠官網版本預覽</title>
<style>
  :root { --bg: #f7f8fa; --ink: #16181d; --ink-2: #5a6070; --accent: #0B5CFF; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101216; --ink: #eceef2; --ink-2: #9aa1b0; --accent: #4d86ff; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px;
  }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { color: var(--ink-2); font-size: 14.5px; margin: 0 0 24px; line-height: 1.7; }
  a {
    display: inline-block; background: var(--accent); color: #fff;
    text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 10px 22px; border-radius: 999px;
  }
</style>
</head>
<body>
<div>
  <h1>找不到這個頁面</h1>
  <p>預覽站已改為多版本架構，舊連結的頁面現在住在各版本的子路徑底下。<br>請從入口頁選擇要看的版本。</p>
  <a href="/reach-website/">回版本入口頁</a>
</div>
</body>
</html>
